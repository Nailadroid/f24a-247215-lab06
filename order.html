<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 06 — The Order</title>
    <link rel="stylesheet" href="lab06.css">
</head>
<body>
    <header style="background-color: #d97706;">
        <h1 style="color: white;">Bakery</h1>
    </header>

    <main>
        <p id="status">Ready to process orders.</p>

        <section id="ticket">
            <section>
            <table>
                <thead>
                    <tr>
                        <th>Order</th>
                        <th>Item</th>
                        <th>Qty</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="sheet"></tbody>
                <form id="order">
            <input type="text" id="item" name="item" required>
            <input type="text" id="qty" name="qty" required>

            <button id="send" type="submit">Send</button>
            <button id="drop" type="button">Drop last</button>
        </form>
            </table>
            <p>Count: <span id="count">0</span></p>
            <p>Takings: <span id="takings">0</span></p>
        </section>
            <span id="ticket-id"></span>
            <span id="ticket-item"></span>
            <span id="ticket-total"></span>
        </section>
    </main>

    <footer>247215</footer>

    <script src="order.js"></script>
</body>
</html>
